name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Build
        env:
          APP_KEYS: ci-key-1,ci-key-2
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          JWT_SECRET: ci-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          ENCRYPTION_KEY: ci-encryption-key
          DATABASE_CLIENT: sqlite
          CLIENT_URL: http://localhost:3000
          PREVIEW_SECRET: ci-preview-secret
        run: bun run build

  docker:
    name: docker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Strapi image
        run: docker build -f apps/strapi/Dockerfile -t starter-strapi .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t starter-web .

